syntax = "proto3";

package emberfilm.users.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  UserRole role = 4;
  google.protobuf.Timestamp creation_date = 5;
  google.protobuf.Timestamp update_date = 6;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_USER = 1;
  USER_ROLE_ADMIN = 2;
}

message GetUserByIDRequest {
  string id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message ListUsersResponse {
  repeated User users = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string idempotency_key = 3;
}

// One service per kind of caller, so that a server applies its authentication per audience: the
// bearer-token interceptor on the user service, the peer-certificate interceptor on the internal
// service. Which service an RPC belongs to says what it needs from the caller before the request
// is read.

// Reachable by a signed-in user. GetUserByID answers for the caller's own row; ListUsers is an
// administrator's, decided in the use case.
service UserUserService {
  rpc GetUserByID(GetUserByIDRequest) returns (User);
  rpc ListUsers(google.protobuf.Empty) returns (ListUsersResponse);
}

// Reachable by another process, identified by its mTLS certificate: what the authentication
// service does on behalf of a caller who has no token yet. Never open GetUserByEmail to a person —
// it would let anyone confirm which addresses have accounts.
service UserInternalService {
  rpc GetUserByID(GetUserByIDRequest) returns (User);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (User);
  rpc CreateUser(CreateUserRequest) returns (User);
}
