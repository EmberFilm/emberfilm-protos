syntax = "proto3";

package emberfilm.newsletter.v1;

import "google/protobuf/timestamp.proto";

service SubscriberService {
  rpc CreateSubscriber(CreateSubscriberRequest) returns (CreateSubscriberResponse);
  rpc ListSubscribers(ListSubscribersRequest) returns (ListSubscribersResponse);
}

message Subscriber {
  string email = 1;
  google.protobuf.Timestamp subscription_date = 2;
}

message CreateSubscriberRequest {
  string email = 1;
}

// Acceptance, not the record. A subscriber is an address rather than an account, and the list of
// addresses is an administrator's to read — including the row just written, so nothing is
// returned that the caller could not otherwise see.
message CreateSubscriberResponse {}

message ListSubscribersRequest {}

message ListSubscribersResponse {
  repeated Subscriber subscribers = 1;
}
