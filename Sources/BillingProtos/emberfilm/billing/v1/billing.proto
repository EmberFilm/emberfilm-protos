syntax = "proto3";

package emberfilm.billing.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// The catalogue, in two halves. A product is the grant a purchase confers — a licence for one
// major version, or a subscription — and how many devices it may enroll; it names no store and
// no price. An offer is one way to buy a product: a provider, the identifier that provider sells
// it under, and what it costs there. What the website calls a package is an offer with its
// product, and its id is the offer's.
service ProductService {
  rpc ListProducts(google.protobuf.Empty) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  rpc DeleteProduct(DeleteProductRequest) returns (google.protobuf.Empty);
}

service OfferService {
  rpc ListOffers(google.protobuf.Empty) returns (ListOffersResponse);
  rpc GetOffer(GetOfferRequest) returns (Offer);
  rpc CreateOffer(CreateOfferRequest) returns (Offer);
  rpc UpdateOffer(UpdateOfferRequest) returns (Offer);
  rpc DeleteOffer(DeleteOfferRequest) returns (google.protobuf.Empty);
}

// Buying, and what was bought. The caller of the first three is the user the token names; the
// webhook carries no caller and is authenticated by its signature; the purchase list names a
// user, who must be the caller unless the caller is privileged.
service BillingService {
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);
  rpc CreatePortalSession(google.protobuf.Empty) returns (CreatePortalSessionResponse);
  rpc HandleCheckoutSuccess(HandleCheckoutSuccessRequest) returns (google.protobuf.Empty);
  rpc HandleStripeWebhook(HandleStripeWebhookRequest) returns (google.protobuf.Empty);
  rpc ListPurchases(ListPurchasesRequest) returns (ListPurchasesResponse);
}

// MARK: - Products

enum ProductType {
  PRODUCT_TYPE_UNSPECIFIED = 0;
  PRODUCT_TYPE_LICENSE = 1;
  PRODUCT_TYPE_SUBSCRIPTION = 2;
}

message Product {
  string id = 1;
  string title = 2;
  ProductType type = 3;
  // The major version a licence is for. Set for a licence, absent for a subscription.
  optional int64 version = 4;
  int32 allowed_devices = 5;
  google.protobuf.Timestamp creation_date = 6;
  google.protobuf.Timestamp update_date = 7;
}

message ListProductsResponse {
  repeated Product products = 1;
}

message GetProductRequest {
  string id = 1;
}

// The identifier is the catalogue's to assign and is returned on the product. The idempotency
// key is required: a create retried with the same key and the same fields returns the product
// already made, and the same key with different fields is refused.
message CreateProductRequest {
  string title = 1;
  ProductType type = 2;
  optional int64 version = 3;
  int32 allowed_devices = 4;
  string idempotency_key = 5;
}

// A partial update: a field left unset keeps its value. The type is not here — a licence does
// not become a subscription; that is a different product.
message UpdateProductRequest {
  string id = 1;
  optional string title = 2;
  optional int64 version = 3;
  optional int32 allowed_devices = 4;
}

message DeleteProductRequest {
  string id = 1;
}

// MARK: - Offers

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_STRIPE = 1;
  PROVIDER_APPLE = 2;
}

message Offer {
  string id = 1;
  string product_id = 2;
  Provider provider = 3;
  // What the provider sells it under: a Stripe price id, an App Store product id.
  string provider_product_id = 4;
  // In the currency's minor unit.
  int64 amount = 5;
  // ISO 4217, lowercase.
  string currency = 6;
  // Days of free trial a subscription offer grants a customer who has never bought anything.
  // Absent for a licence, and for a subscription without one.
  optional int32 trial_period_days = 7;
  google.protobuf.Timestamp creation_date = 8;
  google.protobuf.Timestamp update_date = 9;
}

message ListOffersResponse {
  repeated Offer offers = 1;
}

message GetOfferRequest {
  string id = 1;
}

message CreateOfferRequest {
  string product_id = 1;
  Provider provider = 2;
  string provider_product_id = 3;
  int64 amount = 4;
  string currency = 5;
  optional int32 trial_period_days = 6;
  string idempotency_key = 7;
}

// A partial update. The product and the provider are not here: an offer is one product on one
// store, and a different pairing is a different offer.
message UpdateOfferRequest {
  string id = 1;
  optional string provider_product_id = 2;
  optional int64 amount = 3;
  optional string currency = 4;
  optional int32 trial_period_days = 5;
}

message DeleteOfferRequest {
  string id = 1;
}

// MARK: - Billing

message CreateCheckoutSessionRequest {
  string offer_id = 1;
  // Whether the caller asked for the offer's trial. Granted only when the offer has one and the
  // caller has never bought anything.
  bool request_trial = 2;
}

message CreateCheckoutSessionResponse {
  string url = 1;
}

message CreatePortalSessionResponse {
  string url = 1;
}

// The client's return from Stripe: a trigger, never the truth. The session is re-fetched from
// Stripe before anything is granted.
message HandleCheckoutSuccessRequest {
  string session_id = 1;
}

message HandleStripeWebhookRequest {
  bytes payload = 1;
  string signature = 2;
}

enum PurchaseStatus {
  PURCHASE_STATUS_UNSPECIFIED = 0;
  PURCHASE_STATUS_ACTIVE = 1;
  PURCHASE_STATUS_GRACE_PERIOD = 2;
  PURCHASE_STATUS_BILLING_RETRY = 3;
  PURCHASE_STATUS_CANCELLING = 4;
  PURCHASE_STATUS_EXPIRED = 5;
  PURCHASE_STATUS_REFUNDED = 6;
  PURCHASE_STATUS_REVOKED = 7;
}

// One purchase lineage with a provider: a Stripe checkout session or subscription, an App Store
// transaction or subscription. The entitlement it confers lives with the entitlements service;
// this is the record of the sale and the provider's current view of it.
message Purchase {
  string id = 1;
  string user_id = 2;
  Provider provider = 3;
  ProductType type = 4;
  // The provider's stable identity for the lineage: a checkout session or subscription id, an
  // Apple transaction or original transaction id.
  string source_id = 5;
  optional string current_transaction_id = 6;
  optional string offer_id = 7;
  optional string product_id = 8;
  PurchaseStatus status = 9;
  google.protobuf.Timestamp purchase_date = 10;
  google.protobuf.Timestamp expiration_date = 11;
  google.protobuf.Timestamp cancellation_date = 12;
  google.protobuf.Timestamp creation_date = 13;
  google.protobuf.Timestamp update_date = 14;
}

message ListPurchasesRequest {
  string user_id = 1;
}

message ListPurchasesResponse {
  repeated Purchase purchases = 1;
}
