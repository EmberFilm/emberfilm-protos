syntax = "proto3";

package emberfilm.billing.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// The catalogue and everything a purchase of it involves. A package is a buyable catalogue item —
// the monolith's model: a Stripe price, a title, what it grants, and how many devices it may
// enroll. Reading it is public; writing it is an administrator's.
service PackageService {
  rpc ListPackages(google.protobuf.Empty) returns (ListPackagesResponse);
  rpc GetPackage(GetPackageRequest) returns (Package);
  rpc CreatePackage(CreatePackageRequest) returns (Package);
  rpc UpdatePackage(UpdatePackageRequest) returns (Package);
  rpc DeletePackage(DeletePackageRequest) returns (google.protobuf.Empty);
}

// Buying, and what was bought. The first three RPCs are the user the token names; the webhook
// carries no caller and is authenticated by its signature; the purchase list names a user, who
// must be the caller unless the caller is privileged.
service BillingService {
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);
  rpc CreatePortalSession(google.protobuf.Empty) returns (CreatePortalSessionResponse);
  rpc HandleCheckoutSuccess(HandleCheckoutSuccessRequest) returns (google.protobuf.Empty);
  rpc HandleStripeWebhook(HandleStripeWebhookRequest) returns (google.protobuf.Empty);
  rpc ListPurchases(ListPurchasesRequest) returns (ListPurchasesResponse);
}

// MARK: - Packages

enum PackageType {
  PACKAGE_TYPE_UNSPECIFIED = 0;
  PACKAGE_TYPE_LICENSE = 1;
  PACKAGE_TYPE_SUBSCRIPTION = 2;
}

message Package {
  string id = 1;
  // Stripe price id (`price_…`). Internal — the gateway never exposes it.
  string price_id = 2;
  string title = 3;
  PackageType type = 4;
  int64 amount = 5;
  string currency = 6;
  // Major app version for a licence. Absent for a subscription.
  optional int64 version = 7;
  int32 allowed_devices = 8;
  // Free-trial length in days for a subscription. Absent, or zero, means none.
  optional int32 trial_period_days = 9;
  google.protobuf.Timestamp creation_date = 10;
  google.protobuf.Timestamp update_date = 11;
}

message ListPackagesResponse {
  repeated Package packages = 1;
}

message GetPackageRequest {
  string id = 1;
}

// The identifier is the catalogue's to assign and is returned on the package. The idempotency key
// is required: a create retried with the same key and the same fields returns the package already
// made, and the same key with different fields is refused.
message CreatePackageRequest {
  string price_id = 1;
  string title = 2;
  PackageType type = 3;
  int64 amount = 4;
  string currency = 5;
  optional int64 version = 6;
  int32 allowed_devices = 7;
  optional int32 trial_period_days = 8;
  string idempotency_key = 9;
}

// A partial update: a field left unset keeps its value. The type is not here — a licence does not
// become a subscription; that is a different package.
message UpdatePackageRequest {
  string id = 1;
  optional string price_id = 2;
  optional string title = 3;
  optional int64 amount = 4;
  optional string currency = 5;
  optional int64 version = 6;
  optional int32 allowed_devices = 7;
  optional int32 trial_period_days = 8;
}

message DeletePackageRequest {
  string id = 1;
}

// MARK: - Billing

message CreateCheckoutSessionRequest {
  string package_id = 1;
  bool request_trial = 2;
}

message CreateCheckoutSessionResponse {
  string url = 1;
}

message CreatePortalSessionResponse {
  string url = 1;
}

message HandleCheckoutSuccessRequest {
  string session_id = 1;
}

message HandleStripeWebhookRequest {
  bytes payload = 1;
  string signature = 2;
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_STRIPE = 1;
  PROVIDER_APPLE = 2;
}

enum PurchaseStatus {
  PURCHASE_STATUS_UNSPECIFIED = 0;
  PURCHASE_STATUS_ACTIVE = 1;
  PURCHASE_STATUS_GRACE_PERIOD = 2;
  PURCHASE_STATUS_BILLING_RETRY = 3;
  PURCHASE_STATUS_CANCELLING = 4;
  PURCHASE_STATUS_EXPIRED = 5;
  PURCHASE_STATUS_REFUNDED = 6;
  PURCHASE_STATUS_REVOKED = 7;
}

// One purchase lineage with a provider, and the provider's current view of it. The entitlement it
// confers lives with the entitlements service; this is the record of the sale.
message Purchase {
  string id = 1;
  string user_id = 2;
  Provider provider = 3;
  PackageType type = 4;
  string source_id = 5;
  optional string current_transaction_id = 6;
  optional string package_id = 7;
  PurchaseStatus status = 8;
  google.protobuf.Timestamp purchase_date = 9;
  google.protobuf.Timestamp expiration_date = 10;
  google.protobuf.Timestamp cancellation_date = 11;
  google.protobuf.Timestamp creation_date = 12;
  google.protobuf.Timestamp update_date = 13;
}

message ListPurchasesRequest {
  string user_id = 1;
}

message ListPurchasesResponse {
  repeated Purchase purchases = 1;
}
