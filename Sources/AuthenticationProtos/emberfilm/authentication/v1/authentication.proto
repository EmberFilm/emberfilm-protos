syntax = "proto3";

package emberfilm.authentication.v1;

import "google/protobuf/timestamp.proto";

service AuthenticationService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc AuthenticateWithPassword(AuthenticateWithPasswordRequest) returns (AuthenticationSession);
  rpc RefreshAuthentication(RefreshAuthenticationRequest) returns (AuthenticationSession);
  rpc BeginWebAuthnRegistration(BeginWebAuthnRegistrationRequest) returns (PublicKeyCredentialCreationOptions);
  rpc FinishWebAuthnRegistration(FinishWebAuthnRegistrationRequest) returns (FinishWebAuthnRegistrationResponse);
  rpc BeginWebAuthnAuthentication(BeginWebAuthnAuthenticationRequest) returns (PublicKeyCredentialRequestOptions);
  rpc FinishWebAuthnAuthentication(FinishWebAuthnAuthenticationRequest) returns (AuthenticationSession);
  rpc CreateAuthCode(CreateAuthCodeRequest) returns (CreateAuthCodeResponse);
  rpc ExchangeAuthCode(ExchangeAuthCodeRequest) returns (AuthenticationSession);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc StartPasswordReset(StartPasswordResetRequest) returns (StartPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse);
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  string registration_id = 1;
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {}

message AuthenticateWithPasswordRequest {
  string email = 1;
  string password = 2;
}

message RefreshAuthenticationRequest {
  string refresh_token = 1;
}

message AuthenticationSession {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expiration_date = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp refresh_token_expiration_date = 4;
}

// MARK: - WebAuthn
//
// Every byte string a browser exchanges with an authenticator — challenges, credential IDs,
// client data, attestation objects, signatures — travels as base64url text, which is the form
// `navigator.credentials` produces and consumes. Keeping that encoding on the wire lets the
// gateway pass the values through untouched and leaves one place, the authentication service,
// that decodes them.

message BeginWebAuthnRegistrationRequest {}

message PublicKeyCredentialCreationOptions {
  PublicKeyCredentialRelyingPartyEntity rp = 1;
  PublicKeyCredentialUserEntity user = 2;
  string challenge = 3;
  repeated PublicKeyCredentialParameters pub_key_cred_params = 4;
  optional uint32 timeout_milliseconds = 5;
  string attestation = 6;
}

message PublicKeyCredentialRelyingPartyEntity {
  string id = 1;
  string name = 2;
}

message PublicKeyCredentialUserEntity {
  string id = 1;
  string name = 2;
  string display_name = 3;
}

message PublicKeyCredentialParameters {
  string type = 1;
  int32 alg = 2;
}

message FinishWebAuthnRegistrationRequest {
  RegistrationCredential credential = 1;
}

message RegistrationCredential {
  string id = 1;
  string raw_id = 2;
  AuthenticatorAttestationResponse response = 3;
  string type = 4;
}

message AuthenticatorAttestationResponse {
  string client_data_json = 1;
  string attestation_object = 2;
}

message FinishWebAuthnRegistrationResponse {}

message BeginWebAuthnAuthenticationRequest {}

message PublicKeyCredentialRequestOptions {
  string challenge = 1;
  optional uint32 timeout_milliseconds = 2;
  string rp_id = 3;
  repeated PublicKeyCredentialDescriptor allow_credentials = 4;
  string user_verification = 5;
}

message PublicKeyCredentialDescriptor {
  string type = 1;
  string id = 2;
}

message FinishWebAuthnAuthenticationRequest {
  AuthenticationCredential credential = 1;
}

message AuthenticationCredential {
  string id = 1;
  string raw_id = 2;
  AuthenticatorAssertionResponse response = 3;
  string type = 4;
}

message AuthenticatorAssertionResponse {
  string client_data_json = 1;
  string authenticator_data = 2;
  string signature = 3;
  optional string user_handle = 4;
}

// MARK: - Auth codes
//
// The handoff behind "Continue with Browser": a native app opens a browser, the person signs in
// there, and the browser trades its session for a short-lived code the app can redeem for one of
// its own. The code travels through a custom URL scheme, which is why it is a bearer value with
// a lifetime in minutes rather than anything durable.

message CreateAuthCodeRequest {}

message CreateAuthCodeResponse {
  string code = 1;
}

message ExchangeAuthCodeRequest {
  string code = 1;
}

// MARK: - Sessions

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

// MARK: - Passwords
//
// ChangePassword carries no user. The caller's token names them, for the same reason it does on
// CreateAuthCode: a request able to name its own subject would let anyone set anyone's password.
//
// Neither ChangePassword nor ResetPassword answers with a session. Both revoke every refresh
// token the user holds, and a caller that wants a new session authenticates for one.

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message StartPasswordResetRequest {
  string email = 1;
}

message StartPasswordResetResponse {}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}

// MARK: - Registration

message ResendVerificationEmailRequest {
  string email = 1;
}

message ResendVerificationEmailResponse {}
